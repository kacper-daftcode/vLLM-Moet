id: rtx-pro6000x8
# The local box after the 2026-07-29 hardware upgrade (planned reboot,
# kernel 6.8.0-136): 8x RTX PRO 6000 at CUDA indices 0,1,3,4,5,6,8,9 plus
# 2x RTX 5090 at 2,7 (the 5090 pair has no box file of its own yet). The
# pre-upgrade 4x layout lives on as rtx-pro6000x4 for historical results.
gpus:
  name: "RTX PRO 6000 Blackwell Workstation"
  count: 8
  vram_gb: 96
host_ram_gb: 1007

runtime: docker
docker_image: vllm-moet-recipes:v024-a220c5598
shm_size: 64g

env:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  # /planes mounts /workspace/moet-serve (the whole persistence root); the
  # DS4 recipes address planes-ds4-tp<N> and packs-ds4 beneath it via the
  # {planes_cache} placeholder. NCCL P2P measured SLOWER on this PCIe
  # topology (138-146 vs 155.8 tok/s) - keep it disabled.
  NCCL_P2P_DISABLE: "1"

models:
  GLM-5.2-NVFP4: /workspace/glm-5.2-nvfp4
  DeepSeek-V4-Flash: /workspace/ds4flash-official
  DeepSeek-V4-Flash-0731: /root/models/ds4-flash-0731

planes_cache:
  GLM-5.2-NVFP4: /workspace/.planes-cache-glm-bench
  DeepSeek-V4-Flash: /workspace/moet-serve
  # 0731 caches live on the root volume: /workspace is at 100% (the
  # planes/packs for 0731 were built there from day one).
  DeepSeek-V4-Flash-0731: /root/moet-serve-0731

log_dir: /root/logs/bench

# external eval tool for the quality suite (git SHA recorded in results)
quality_tool: /workspace/llm-inference-bench/llm_decode_bench.py
quality_tool_sha256: f73a630b3fda58a9bfdbe3dd5caee65410f43314680c24d43c0358eec5ea46f1
