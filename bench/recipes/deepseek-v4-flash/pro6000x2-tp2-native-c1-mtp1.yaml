id: deepseek-v4-flash/pro6000x2-tp2-native-c1-mtp1
role: baseline
model: DeepSeek-V4-Flash
served_name: deepseek-v4-flash
summary: "2x RTX PRO 6000 TP2 - native C1/32k MTP-1 anchor (baseline)"

requires:
  gpus: 2
  vram_gb: 96

context: 32768
load_timeout_s: 2400

# Native pseudo-recipe for the C1/32k anchor family (session I,
# 2026-07-29/30): the serve-args are the anchor container's, verbatim.
# MTP-1, eager (pre graphs-rule anchor; measured 2026-07-29).
env:
  VLLM_MOE_W2: "0"

serve_args:
  - --trust-remote-code
  - --tensor-parallel-size 2
  - --disable-custom-all-reduce
  - --kv-cache-dtype fp8
  - --block-size 256
  - --max-model-len 32768
  - --gpu-memory-utilization 0.92
  - --max-num-batched-tokens 256
  - --max-num-seqs 1
  - --tokenizer-mode deepseek_v4
  - --no-scheduler-reserve-full-isl
  - --enforce-eager
  - --speculative-config {"method":"deepseek_mtp","num_speculative_tokens":1}
