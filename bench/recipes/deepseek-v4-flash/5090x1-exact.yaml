id: deepseek-v4-flash/5090x1-exact
role: quality
model: DeepSeek-V4-Flash
served_name: deepseek-v4-flash
summary: "1x RTX 5090 (32 GB) - exact layer-wise FP4 streamed from RAM/NVMe"

requires:
  gpus: 1
  vram_gb: 32
  host_ram_gb: 96

context: 32768
load_timeout_s: 2400

# Correctness-first fallback for hardware where the full routed-expert stack
# cannot stay in VRAM. The router runs first; every routed full-FP4 row for the
# current MoE layer is synchronously loaded from the persistent pack before
# descriptor construction/GEMM. Previous-layer slots are then reusable, so the
# whole-model routed union never has to fit and no model/KV replay is needed.
#
# Initial full-model evidence, 2026-07-27, runtime branch
# exact-layer-streaming-2026-07-27 over db13b2e9c:
#   - GSM8K-200: 194/200, exactly the native C2 baseline's 194/200, one flip
#     each way, McNemar p=1, mean completion tokens +0.4%, zero
#     errors/truncations; vs native C1: 194 vs 193, p=1, token median +0.0%,
#     geomean +0.79%;
#   - newly measured geometry anchor (native TP2, C1/no-spec/eager/32k):
#     native 192/200 vs exact 194/200, flips 1/3, p=0.625; token mean -0.23%,
#     median +0.0%, geomean +0.24%;
#   - matching native GPQA anchor: 142/198 (71.72%); exact 145/198 (73.23%),
#     flips native-only 11 / exact-only 14, p=0.69; token mean +3.3%,
#     median +0.0%, geomean +2.14%; both have the same chronic max30k
#     truncation, zero engine errors.
#   - GPQA-20 @32k: 13/20, exactly the window-matched native anchor's 13/20,
#     flips 1 each way, p=1, token median -2.9%, geomean +3.8%, the same
#     chronic 6000-token truncation, zero engine/request errors;
#   - aggregate generation 3.5 tok/s, TTFT 3.89 s;
#   - synthetic all-FP4 parity: max-relative 1.781e-02, cosine 0.999902,
#     zero base misses;
#   - TP1/TP2 forced-eviction and fail-closed store-fault tests pass.
# Do not list this recipe in the release quality matrix until the DS4 THINK
# requirement is resolved; GSM8K and non-think GPQA are fully closed.
env:
  VLLM_MOE_W2: "1"
  # One mounted persistence root: planes at its v2/ subtree, exact/base packs
  # under packs/. Container/box env may override these paths.
  VLLM_MOE_W2_PLANES_CACHE: "{planes_cache}"
  VLLM_MOE_W2_STORE_DIR: "{planes_cache}/packs"
  # Exact full-FP4 slots always win descriptor dispatch. The base pool is only
  # a non-dereferenced standby required to initialize the host-backed loader;
  # 0.1 GiB yields 15 slots and saves 3.4 GiB vs the old cache minimum.
  VLLM_MOE_W2_BASE_CACHE_GB: "0.1"
  # 265 full-FP4 slots on TP1: >= all 256 experts in one broad prefill layer.
  VLLM_MOE_W2_DELTA_GB: "3.3"
  VLLM_MOE_W2_DELTA_SPLIT: "0"
  VLLM_MOE_W2_EXACT_LAYERWISE: "1"
  VLLM_MOE_W2_GATE: "0"
  VLLM_MOE_W2_REPLAY_MODE: "strict"
  VLLM_MOE_W2_PREFILL_FP4: "ensure"
  VLLM_MOE_W2_PREFILL_T: "16"
  VLLM_MOE_W2_FUSED_UNPERMUTE: "0"
  VLLM_MOE_W2_SWIGLU_CLAMP: "1"
  VLLM_MOE_W2_SWIGLU_CLAMP_FP32: "1"

serve_args:
  - --trust-remote-code
  - --kv-cache-dtype fp8
  - --block-size 256
  - --max-model-len 32768
  - --gpu-memory-utilization 0.95
  - --max-num-batched-tokens 256
  - --max-num-seqs 1
  - --tokenizer-mode deepseek_v4
  - --no-scheduler-reserve-full-isl
  - --enforce-eager

warmup:
  decode_requests: 2

suite_params:
  gsm8k:
    concurrency: 1
  gpqa:
    concurrency: 1
  batch_decode:
    concurrency: [1]
  needle:
    sizes_words: [6000]

tuning:
  objective: decode.median_tok_s
  constraints: ["arithmetic.score>=2", "needle.all_pass"]
  axes: []
