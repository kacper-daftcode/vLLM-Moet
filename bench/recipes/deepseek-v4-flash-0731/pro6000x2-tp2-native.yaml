id: deepseek-v4-flash-0731/pro6000x2-tp2-native
role: baseline
model: DeepSeek-V4-Flash-0731
served_name: deepseek-v4-flash
summary: "2x RTX PRO 6000 TP2 - stock FP4 native quality baseline (0731, no spec)"

requires:
  gpus: 2
  vram_gb: 96

context: 131072
load_timeout_s: 2400

# Native pseudo-recipe for the 0731 anchor family. NO speculative config
# on purpose: 0731 has no MTP head (deepseek_mtp boots KeyError
# model.layers.43.mtp_block.*) and greedy accuracy is spec-invariant, so
# native-without-spec is the correct quality baseline (precedent: the
# 2026-08-12 manual anchors ds4-flash/native-tp2-{gsm8k-c2,gpqa-nt}-0731,
# commit 0572785, measured with exactly these serve args at C=2).
# A runner-bound (strict:true) re-measurement through this recipe is what
# promotes those anchors past their manual provenance.
env:
  VLLM_MOE_W2: "0"

serve_args:
  - --trust-remote-code
  - --tensor-parallel-size 2
  - --disable-custom-all-reduce
  - --kv-cache-dtype fp8
  - --block-size 256
  - --max-model-len 131072
  - --gpu-memory-utilization 0.92
  - --max-num-batched-tokens 4096
  - --max-num-seqs 2
  - --tokenizer-mode deepseek_v4
  - --no-scheduler-reserve-full-isl
  - --compilation-config {"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}

suite_params:
  gsm8k:
    concurrency: 2
  gpqa:
    concurrency: 2
  batch_decode:
    concurrency: [1, 2]
