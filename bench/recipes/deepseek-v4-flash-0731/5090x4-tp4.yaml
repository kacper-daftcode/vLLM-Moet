id: deepseek-v4-flash-0731/5090x4-tp4
model: DeepSeek-V4-Flash-0731
served_name: deepseek-v4-flash
summary: "4x RTX 5090 TP4 - resident planes, gated FP4, 128k window PROPOSAL (0731 + DSpark)"

requires:
  gpus: 4
  vram_gb: 32

context: 131072
load_timeout_s: 2400

# 0731 MIGRATION (2026-08-12) of deepseek-v4-flash/5090x4-tp4 - PROPOSAL,
# NOT BOOT-VALIDATED: no 4x5090 box is attached at migration time (the
# serving box carries 2x 5090). Validate the first boot before trusting
# the window.
#
# Geometry carried from the old cell (resident planes ~18.2 GiB/rank,
# delta 4.5 clearing the k=2 fire floor at seqs 1, gate tau 0.60 uncapped
# + S4 spec-mask + prefill-FP4 ensure; old-rev quality: GSM8K 97.0-97.5,
# GPQA NT matched native, ~165 tok/s agg). Changes:
#   - spec: deepseek_mtp k=2 -> DSpark k=2 (same verify T=3/seq, fire
#     floor arithmetic unchanged). Old-rev record: MTP-2 healthy on
#     RESIDENT routes (the spec-drift caveat is for streamed-base cells).
#   - window: 32k -> 131072 TARGET. Per-rank arithmetic at util 0.95
#     (30.4 GiB budget): planes 18.2 + pool 4.5 + dense/drafter ~3 +
#     KV at 131k (MLA fp8, ~1-2 GiB) + graphs workspace = tight but
#     plausible. If the first boot OOMs: drop to
#     --max-model-len 65536 first, delta 4.5 -> 4.0 second (floor 1316
#     slots must stay covered), never gate-off (quality lever).
# Quality on 0731 TO BE measured by the runner once the box exists.
env:
  VLLM_MOE_W2: "1"
  VLLM_MOE_W2_PLANES_CACHE: "{planes_cache}/planes-ds4-tp4"
  VLLM_MOE_W2_STORE_DIR: "{planes_cache}/packs-ds4-tp4"
  VLLM_MOE_W2_DELTA_GB: "4.5"
  VLLM_MOE_W2_GATE: "1"
  VLLM_MOE_W2_GATE_TAU: "0.60"
  VLLM_MOE_W2_GATE_MAX_PROMOTE: "0"
  VLLM_MOE_W2_GATE_SPEC_MASK: "1"
  VLLM_MOE_W2_PREFILL_FP4: "ensure"
  VLLM_MOE_W2_PREFILL_T: "16"

serve_args:
  - --trust-remote-code
  - --tensor-parallel-size 4
  - --disable-custom-all-reduce
  - --kv-cache-dtype fp8
  - --block-size 256
  - --max-model-len 131072
  - --gpu-memory-utilization 0.95
  - --max-num-batched-tokens 1024
  - --max-num-seqs 1
  - --tokenizer-mode deepseek_v4
  - --no-scheduler-reserve-full-isl
  - --speculative-config {"method":"dspark","num_speculative_tokens":2}
  - --compilation-config {"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}

suite_params:
  batch_decode:
    concurrency: [1, 4]
  needle:
    sizes_words: [8000, 90000]
    depth: 0.5

tuning:
  objective: decode.median_tok_s
  constraints: ["arithmetic.score>=2", "needle.all_pass"]
  axes: []
