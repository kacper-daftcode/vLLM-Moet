# The MoET hybrid's host (/etc/sysctl.d/): no proactive memory compaction - with ~450 GiB of unmovable pinned pages the compaction
# daemon mostly fails and retries (pgmigrate_fail in the millions per boot) and competes with the CPU-tier pool cores; THP for the
# Engram tables is madvise'd and still gets its huge pages at fault time (transparent_hugepage/defrag = madvise).
vm.compaction_proactiveness = 0
